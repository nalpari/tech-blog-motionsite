# EC2 의 /etc/nginx/sites-available/blog.devgrr.kr 에 둔다.
# HTTPS 는 앞단 AWS 로드밸런서가 끝내고 여기는 http 로만 받는다.
# 정적 사이트 컨테이너(127.0.0.1:3100)로 그대로 넘긴다.
server {
    listen 80;
    listen [::]:80;
    server_name blog.devgrr.kr;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 로드밸런서가 붙인 원래 스킴(https)을 그대로 넘긴다.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
