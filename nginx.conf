# 컨테이너 안의 nginx. 호스트 nginx 가 127.0.0.1:3100 으로 넘겨준다.
server {
    listen 80;
    root /usr/share/nginx/html;
    # /posts/x → /posts/x/ 리다이렉트를 상대 경로로 보내 HTTPS 뒤에서도 http 로 떨어지지 않게 한다.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # 파일명에 해시가 붙는 빌드 산출물은 오래 캐시한다.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
